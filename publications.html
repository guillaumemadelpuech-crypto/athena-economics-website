<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publications | Athena Economics</title>
<meta name="description" content="Publications by Athena Economics on transfer pricing and economic analysis. Section in progress.">
<style>

  :root {
    --navy: #0a1f3d;
    --navy-light: #1a3a5c;
    --accent: #6b2737;
    --grey: #7d7d75;
    --grey-light: #a9b4c2;
    --square-grey: #e8eaed;
    --text: #1c2733;
    --bg: #ffffff;
    --border: #d9dee5;
    --font-serif: Cambria, 'Times New Roman', Georgia, serif;
    --font-sans: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-serif);
    color: var(--text);
    line-height: 1.6;
    background: var(--bg);
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- HEADER / NAV ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 4vw;
    border-bottom: 3px solid var(--navy);
    position: relative;
    z-index: 100;
    background: #fff;
  }

  .logo-block img {
    height: 84px;
    display: block;
  }

  nav ul {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    font-family: var(--font-sans);
    font-size: 0.95rem;
  }

  nav li { position: relative; text-align: center; }

  nav > ul > li > a {
    padding: 0.5rem 0.6rem;
    color: var(--navy);
    display: inline-block;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  nav > ul > li > a:hover,
  nav > ul > li.active > a {
    border-color: var(--accent);
    color: var(--accent);
  }

  nav .no-link {
    padding: 0.5rem 0.6rem;
    color: var(--navy);
    display: inline-block;
    cursor: default;
  }

  /* Dropdown for Services: stacked light-grey squares */
  .has-dropdown .dropdown {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    padding-top: 0.6rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
  }

  .has-dropdown:hover .dropdown,
  .has-dropdown:focus-within .dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .dropdown li a {
    display: block;
    width: 210px;
    padding: 1rem 1.1rem;
    background: var(--square-grey);
    color: var(--navy);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    border-radius: 3px;
    box-shadow: 0 6px 16px rgba(10,31,61,0.1);
  }

  .dropdown li a:hover {
    background: var(--navy);
    color: #fff;
  }

  .construction-banner {
    background: var(--square-grey);
    color: var(--navy);
    font-family: var(--font-sans);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 0.55rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  /* ---------- HERO / PAGE SECTIONS ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 4vw; padding-bottom: 6rem; }

  .hero {
    padding: 5rem 0 4rem;
    max-width: 780px;
  }

  .hero p.lede {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    color: var(--navy);
    line-height: 1.65;
  }

  .hero .tagline {
    font-family: var(--font-serif);
    font-size: 2rem;
    color: var(--navy);
    font-variant: small-caps;
    letter-spacing: 0.03em;
    margin-bottom: 1.4rem;
  }

  section { padding: 3.5rem 0; border-top: 1px solid var(--border); }
  section:first-of-type { border-top: none; }

  h2 {
    font-family: var(--font-serif);
    font-size: 1.6rem;
    color: var(--navy);
    margin-bottom: 1.6rem;
    font-weight: normal;
  }

  section p, .about-text p, .service-page p, .service-page li {
    font-family: var(--font-serif);
    font-size: 1.35rem;
  }

  .service-page ul {
    margin-top: 1rem;
    padding-left: 1.4rem;
  }
  .service-page li { margin-bottom: 0.6rem; }

  /* ---------- ABOUT PAGE ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 3rem;
    align-items: start;
    padding: 4rem 0;
  }

  .about-photo img {
    width: 100%;
    border-radius: 4px;
    filter: grayscale(8%);
    border: 2px solid var(--navy);
    box-shadow: 0 8px 20px rgba(10,31,61,0.25);
  }

  .about-photo .linkedin {
    display: inline-block;
    margin-top: 1rem;
    font-family: var(--font-sans);
    font-size: 0.85rem;
    color: var(--accent);
    border-bottom: 1px solid var(--accent);
  }

  .about-text p {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    margin-bottom: 1.1rem;
    color: var(--text);
  }

  /* ---------- LEGAL PAGES ---------- */
  .legal p { margin-bottom: 0.9rem; font-family: var(--font-serif); font-size: 1rem; }

  @media (max-width: 680px) {
    .about-grid { grid-template-columns: 1fr; }
    .about-photo img { max-width: 200px; }
    nav ul { display: flex; gap: 1.1rem; font-size: 0.82rem; flex-wrap: wrap; }
    header { padding: 1rem 5vw; flex-direction: column; gap: 1rem; align-items: flex-start; }
    .logo-block { order: 2; align-self: flex-end; }
    .logo-block img { height: 56px; }
    nav { order: 1; }
  }

  footer {
    background: var(--navy);
    color: #cfd8e3;
    font-family: var(--font-sans);
    font-size: 0.85rem;
    text-align: center;
    padding: 1rem 1rem;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    z-index: 300;
  }

  footer .legal-links { display: inline-flex; gap: 1.2rem; }
  footer .legal-links a {
    color: #cfd8e3;
    border-bottom: 1px solid rgba(207,216,227,0.4);
  }
  footer .legal-links a:hover { color: #fff; }

</style>
</head>
